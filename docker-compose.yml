services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: amhews
      POSTGRES_USER: amhews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amhews}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amhews -d amhews"]
      interval: 5s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    ports:
      - "1883:1883"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://amhews:${POSTGRES_PASSWORD:-amhews}@db:5432/amhews
      MQTT_HOST: mqtt
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
  mqtt_data:
