# Development broker. For field devices in production:
#   allow_anonymous false
#   password_file /mosquitto/config/passwords   (one entry per device, created at registration)
#   acl_file /mosquitto/config/acl              (each device may only use devices/<its id>/#)
#   listener 8883 with TLS certificates
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
